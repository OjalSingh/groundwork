[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwork"
version = "0.1.0"
description = "A research-first social content pipeline: every claim is sourced, every post is linted for slop, every design ships as an image or a Canva recipe."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
    "click>=8.1",
    "httpx>=0.27",
    "pillow>=10",
    "flask>=3",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
claude = ["anthropic>=2.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
groundwork = "groundwork.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groundwork = ["platforms/templates/*.yaml", "design/presets/*.yaml", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
