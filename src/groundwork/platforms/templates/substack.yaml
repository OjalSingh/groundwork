name: substack
display_name: Substack
formats:
  article:
    description: A long-form, fully referenced essay or breakdown.
    parts: {min: 4, max: 12, max_chars: 6000}
    hook_max_chars: 300
    hashtags: {max: 0}
    citations: footnotes
    design: {kind: header, size: [1456, 816], max_slides: 1}
    guidance: |
      Each part is a section and starts with a "## " heading line.
      Explain the mechanism, not just the conclusion. End with a sources section.
  note:
    description: A short Substack Note that points to one finding.
    parts: {min: 1, max: 1, max_chars: 1000}
    hook_max_chars: 300
    hashtags: {max: 0}
    citations: inline
    design: {kind: none}
    guidance: |
      One finding, one source, one sentence of why it matters.
posting_windows:
  - {days: [tue], times: ["09:00"]}
max_posts_per_day: 1
