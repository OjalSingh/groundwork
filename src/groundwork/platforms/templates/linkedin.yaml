name: linkedin
display_name: LinkedIn
formats:
  post:
    description: A text post that teaches one idea from experience or evidence.
    parts: {min: 1, max: 6, max_chars: 3000, total_max_chars: 3000}
    hook_max_chars: 200
    hashtags: {max: 3}
    citations: first_comment
    design: {kind: none}
    guidance: |
      First two lines decide whether anyone clicks "see more": make them specific.
      Short paragraphs. No engagement bait ("Agree?", "Comment YES").
  carousel:
    description: A document carousel (PDF) that walks through a concept slide by slide.
    parts: {min: 1, max: 3, max_chars: 3000, total_max_chars: 3000}
    hook_max_chars: 200
    hashtags: {max: 3}
    citations: last_slide
    design: {kind: carousel, size: [1080, 1350], min_slides: 5, max_slides: 12}
    guidance: |
      One idea per slide, 30 words max per slide. Last slide lists sources.
posting_windows:
  - {days: [tue, wed, thu], times: ["08:00", "12:00"]}
max_posts_per_day: 1
